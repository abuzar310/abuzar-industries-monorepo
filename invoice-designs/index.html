<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abuzar Industries · Invoice Design Options</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",sans-serif;background:#191713;color:#EFEAE0;min-height:100vh;
       display:flex;flex-direction:column}
  header{padding:20px 28px;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #35302a}
  header h1{font-size:16px;font-weight:700;letter-spacing:.04em}
  header span{font-size:12px;color:#9a917f}
  nav{display:flex;gap:8px;padding:12px 28px;border-bottom:1px solid #35302a}
  nav button{background:#26221c;color:#EFEAE0;border:1px solid #3d372e;padding:8px 16px;font-size:13px;
             cursor:pointer;border-radius:6px}
  nav button.on{background:#EFEAE0;color:#191713;font-weight:700}
  iframe{flex:1;width:100%;border:none;background:#8a8478}
</style>
</head>
<body>
  <header><h1>Invoice redesign options</h1><span>same data (invoice 2717) in three structures. Click through, print-preview each.</span></header>
  <nav>
    <button class="on" data-src="option-3a-woodmark.html">3A · Woodmark</button>
    <button data-src="option-3b-timber-band.html">3B · Timber Band</button>
    <button data-src="option-3c-grain-letterhead.html">3C · Grain Letterhead</button>
    <button data-src="option-3-sawmill-docket.html">3 · original docket</button>
    <button data-src="option-1-heritage-ledger.html">1 · Heritage Ledger</button>
    <button data-src="option-2-modern-mill.html">2 · Modern Mill</button>
  </nav>
  <iframe src="option-3a-woodmark.html"></iframe>
  <script>
    const frame=document.querySelector("iframe");
    document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); frame.src=b.dataset.src;
    }));
  </script>
</body>
</html>
